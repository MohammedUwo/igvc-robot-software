templates:
  oval_with_chicane:
    tile_size: 14.2
    start_tile_index: 0
    # Closed rectangular macro loop. Tile geometry is local; rotation maps each tile's
    # south->north canonical ports onto the desired world heading.
    tiles:
      - {tile: straight, pos: [0, -3], rotation_deg: 270}
      - {tile: straight, pos: [1, -3], rotation_deg: 270}
      - {tile: straight, pos: [2, -3], rotation_deg: 270}
      - {tile: gentle_left, pos: [3, -3], rotation_deg: 270}
      - {tile: straight, pos: [3, -2], rotation_deg: 0}
      - {tile: s_chicane_left_right, pos: [3, -1], rotation_deg: 0}
      - {tile: straight, pos: [3, 0], rotation_deg: 0}
      - {tile: gentle_left, pos: [3, 1], rotation_deg: 0}
      - {tile: straight, pos: [2, 1], rotation_deg: 90}
      - {tile: no_mans_land_entry, pos: [1, 1], rotation_deg: 90}
      - {tile: no_lane_zone, pos: [0, 1], rotation_deg: 90}
      - {tile: ramp_straight, pos: [-1, 1], rotation_deg: 90}
      - {tile: no_mans_land_exit, pos: [-2, 1], rotation_deg: 90}
      - {tile: gentle_left, pos: [-3, 1], rotation_deg: 90}
      - {tile: straight, pos: [-3, 0], rotation_deg: 180}
      - {tile: obstacle_zone, pos: [-3, -1], rotation_deg: 180}
      - {tile: straight, pos: [-3, -2], rotation_deg: 180}
      - {tile: gentle_left, pos: [-3, -3], rotation_deg: 180}
      - {tile: straight, pos: [-2, -3], rotation_deg: 270}
      - {tile: straight, pos: [-1, -3], rotation_deg: 270}
